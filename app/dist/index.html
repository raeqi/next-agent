after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  z-index: 0;\n  opacity: 0.35;\n  background-image: radial-gradient(rgba(255, 255, 255, 0.035) 0.5px, transparent 0.5px);\n  background-size: 3px 3px;\n}\n\n.helm-root ::selection { background: var(--h-signal-dim); color: var(--h-text); }\n\n/* ---------- 顶栏 ---------- */\n.helm-topbar {\n  position: relative;\n  z-index: 2;\n  display: flex;\n  align-items: center;\n  gap: 18px;\n  height: 52px;\n  padding: 0 14px 0 16px;\n  border-bottom: 1px solid var(--h-line);\n  background: linear-gradient(180deg, #121518 0%, #0e1113 100%);\n  flex: none;\n}\n.helm-brand { display: flex; align-items: center; gap: 9px; min-width: 0; }\n.helm-brand__mark {\n  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px;\n  color: var(--h-signal); border: 1px solid var(--h-signal-line); background: var(--h-signal-dim);\n}\n.helm-brand__name {\n  font-size: 13px; font-weight: 650; letter-spacing: 0.14em;\n}\n.helm-brand__sub { font-size: 11px; color: var(--h-text-3); letter-spacing: 0.04em; }\n\n.helm-topline {\n  display: flex; align-items: center; gap: 10px; min-width: 0;\n  font-size: 11.5px; color: var(--h-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.helm-topline b { color: var(--h-text); font-weight: 550; }\n.helm-topline__sep { width: 1px; height: 12px; background: var(--h-line-2); flex: none; }\n\n.helm-topright { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }\n\n.helm-budget {\n  display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px;\n  border: 1px solid var(--h-line); border-radius: 999px; background: var(--h-panel);\n  font-family: var(--h-mono); font-size: 11px; color: var(--h-text-2);\n}\n.helm-budget b { color: var(--h-text); font-weight: 500; }\n.helm-budget__bar { width: 52px; height: 3px; border-radius: 2px; background: var(--h-line-2); overflow: hidden; }\n.helm-budget__ olor: transparent; color: var(--h-text-2); }\n.h-btn--ghost:hover:not(:disabled) { color: var(--h-text); background: var(--h-panel-2); }\n.h-btn--danger { border-color: rgba(239, 106, 95, 0.4); color: #ff9b92; }\n.h-btn--danger:hover:not(:disabled) { background: var(--h-err-dim); border-color: var(--h-err); }\n.h-btn--sm { height: 24px; padding: 0 9px; font-size: 11px; border-radius: 7px; }\n.h-btn--block { width: 100%; }\n\n.h-chip {\n  display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 7px;\n  border-radius: 5px; border: 1px solid var(--h-line-2); background: var(--h-panel-2);\n  color: var(--h-text-2); font-size: 10.5px; font-weight: 500; white-space: nowrap;\n}\n.h-chip--signal { color: var(--h-signal); border-color: var(--h-signal-line); background: var(--h-signal-dim); }\n.h-chip--ok { color: var(--h-ok); border-color: rgba(74, 192, 138, 0.3); background: var(--h-ok-dim); }\n.h-chip--warn { color: var(--h-warn); border-color: rgba(233, 185, 73, 0.3); background: var(--h-warn-dim); }\n.h-chip--err { color: var(--h-err); border-color: rgba(239, 106, 95, 0.3); background: var(--h-err-dim); }\n.h-chip--info { color: var(--h-info); border-color: rgba(110, 168, 254, 0.3); background: var(--h-info-dim); }\n.h-chip--dim { color: var(--h-text-3); background: transparent; }\n.h-chip--mono { font-family: var(--h-mono); font-size: 10px; letter-spacing: 0.02em; }\n\n.h-dot {\n  width: 6px; height: 6px; border-radius: 50%; flex: none;\n  background: var(--h-text-3); display: inline-block;\n}\n.h-dot--ok { background: var(--h-ok); }\n.h-dot--warn { background: var(--h-warn); }\n.h-dot--err { background: var(--h-err); }\n.h-dot--signal { background: var(--h-signal); }\n.h-dot--live { background: var(--h-signal); box-shadow: 0 0 0 0 rgba(242, 163, 60, 0.5); animation: h-pulse 1.8s infinite; }\n\n.h-sec {\n  display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px;\n  flex: none; border-bottom: 1px solid var(--h-line);\n}\n.h-sec__l   /** 创建元素：H.el('div.cls#id', {attrs}, ...children) */
  function el(spec, attrs, ...children) {
    let tag = 'div';
    let cls = '';
    let id = '';
    const m = String(spec).match(/^([a-zA-Z0-9-]*)((?:[.#][\w-]+)*)$/);
    if (m) {
      tag = m[1] || 'div';
      const tail = m[2] || '';
      tail.replace(/([.#])([\w-]+)/g, (_, sig, name) => {
        if (sig === '.') cls = cls ? cls + ' ' + name : name;
        else id = name;
        return '';
      });
    }
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (id) node.id = id;
    if (attrs) {
      for (const key of Object.keys(attrs)) {
        const value = attrs[key];
        if (value === null || value === undefined || value === false) continue;
        if (key === 'style' && typeof value === 'object') Object.assign(node.style, value);
        else if (key === 'html') node.innerHTML = value;
        else if (key === 'text') node.textContent = value;
        else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2).toLowerCase(), value);
        else if (key === 'dataset') Object.assign(node.dataset, value);
        else node.setAttribute(key, value === true ? '' : String(value));
      }
    }
    append(node, children);
    return node;
  }

  function append(node, children) {
    for (const child of children) {
      if (child === null || child === undefined || child === false) continue;
      if (Array.isArray(child)) append(node, child);
      else if (child instanceof Node) node.appendChild(child);
      else node.appendChild(document.createTextNode(String(child)));
    }

// ===== engine.js =====
/**
 * HELM · 剧本播放引擎（engine.js）
 *
 * 只做「状态 + 计时」，不碰 DOM、不依赖 H、不使用 import/export：
 * app/build.mjs 会把它和 dom.js / scenario.js / 视图模块拼进同一个 IIFE。
 *
 * 设计要点（为什么这么写）：
 * - 时间全部可注入（opts.schedule / opts.now / opts.speed）。浏览器里默认
 *   setTimeout + Date.now，测试里换成假时钟，就能在 node:vm 里瞬间跑完 20 秒剧本。
 * - state 原地修改 + rev++，视图只在 rev 变化时重绘；selected 始终是
 *   missions[selectedId] 的同一个引用，视图可以安全地拿 prevState 做 diff。
 * - 每个任务一条独立时间线：审批、暂停、接管都只停自己的计时器，多个任务才可能真并行；
 *   如果用一全局 timer，任何一次暂停都会拖慢别人。
 * - 审批 open 时停住整个任务，而不是「跳过继续」：审批的意义是「没有你的决定，后续
 *   动作就没有合法依据」。跳过会把风险动作伪装成已完成，直接破坏产品叙事。
 * - autoResolve 不是「免掉审批」，而是「按档位预先授权」：只有任务档位 >= 要求档位时
 *   才 delayMs 后以 label 自动解决；档位不够就老老实实等人。
 * - 播放中每条 beat 的 t 是相对上一条的等待毫秒数；速度 = 1x/4x，接管交还后再额外减半
 *   （叙事：人给过方向后 agent 更快）。
 */

function createEngine(opts) {
  opts = opts || {};

  /* ══════════════════════════════════════════════════════════
   * 0. 依赖注入与纯工具
   * ══════════════════════════════════════════════════════════ */

  const SCEN = opts.scenario != null
    ? opts.scenario
    : (typeof SCENARIO !== 'undefined' ? SCENARIO : null);
  if (!SCEN || typeof SCEN !== 'object') {
    throw new Error('createEngine: 找不到 SCENARIO 剧本数据');
  }

  /** 默认用全局 setTimeout；注入的 schedule 约定返回「取消函数」。 */
  const rawSchedule = typeof opts.schedule === 'function'
    ? opts.schedule
    : function (fn, ms) {
        const id = setTimeout(fn, ms);
        return function () { clearTimeout(id); };
      };
  const now = typeof opts.now === 'function' ? opts.now : function () { return Date.now(); };

  function schedule(fn, ms) {
    let handle = null;
    try {
      handle = rawSchedule(fn, Math.max(0, Number(ms) || 0));
    } catch (err) {
      return function () {};
    }
    if (handle && typeof handle.cancel === 'function') return function () { handle.cancel(); };
    if (typeof handle === 'function') return handle;
    // 有些宿主 return 的是 timer id（像原生 setTimeout）；无法取消时靠 disposed 兜底。
    return function () {};
  }

  /** 深拷贝剧本数据：engine 绝不能改到 SCENARIO / 模板 / 快照本身。 */
  function clone(value) {
    if (value === null || typeof value !== 'object') return value;
    if (Array.isArray(value)) {
      const arr = new Array(value.length);
      for (let i = 0; i < value.length; i += 1) arr[i] = clone(value[i]);
      return arr;
    }
    const obj = {};
    for (const key in value) {
      if (Object.prototype.hasOwnProperty.call(value, key)) obj[key] = clone(value[key]);
    }
    return obj;
  }

  function num(value, fallback) {
    return typeof value === 'number' && isFinite(value) ? value : fallback;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function round6(n) { return Math.round(n * 1e6) / 1e6; }

  const LEVEL_RANK = { observe: 0, propose: 1, drive: 2, auto: 3 };
  function rankOf(level) { return LEVEL_RANK[level] == null ? LEVEL_RANK.drive : LEVEL_RANK[level]; }
  function normLevel(level, fallback) {
    return LEVEL_RANK[level] == null ? fallback : level;
  }

  /** 分钟数 → "09:12" */
  function fmtClock(minutes) {
    const total = ((Math.floor(minutes) % 1440) + 1440) % 1440;
    return pad2(Math.floor(total / 60)) + ':' + pad2(total % 60);
  }
  /** 秒数 → "09:12:04"（剧本里 feed 的 at 用） */
  function fmtClockSec(totalSec) {
    let sec = Math.floor(totalSec) % 86400;
    if (sec < 0) sec += 86400;
    return pad2(Math.floor(sec / 3600)) + ':' + pad2(Math.floor((sec % 3600) / 60)) + ':' + pad2(sec % 60);
  }
  /** 紧凑耗时（舰队卡一行里放得下）："42s" / "12m" / "3h 05m" */
  function fmtElapsed(sec) {
    const s = Math.max(0, Math.round(num(sec, 0)));
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h ' + pad2(m % 60) + 'm';
  }

  const START_CLOCK_MIN = num(SCEN.startClock, 552); // 09:12
  const DAY = SCEN.day || '';

  /* ══════════════════════════════════════════════════════════
   * 1. 状态与内部账本
   * ══════════════════════════════════════════════════════════ */

  const state = {
    rev: 0,
    clock: fmtClock(START_CLOCK_MIN),
    day: DAY,
    autonomy: normLevel(SCEN.autonomy, 'drive'),
    speed: opts.speed === 4 ? 4 : 1, // 视图的 1x/4x 按钮直接读它（Lead 约定）
    budget: {
      usedUsd: num((SCEN.budget || {}).usedUsd, 0),
      capUsd: num((SCEN.budget || {}).capUsd, 20),
      usedTokens: num((SCEN.budget || {}).usedTokens, 0),
    },
    fleet: [],
    selectedId: '',
    missions: {},
    selected: null,
    flash: null,
  };

  /** 舰队展示顺序（state.fleet 每帧按它重建）。 */
  let order = [];
  /** 每个任务的运行时（播放游标/定时器/分组等，不进 state）。 */
  let runtimes = {};
  /** 上次同步进总预算的每任务成本/ token，用于「增量」汇总而不重复累加。 */
  let costTracked = {};
  let tokenTracked = {};

  let missionSeq = 0; // m-user-<n>
  let elapsedRealSec = 0; // 引擎启动后的真实秒数（时钟/at 都基于它）
  const startedAt = now();

  let disposed = false;
  const timers = new Set(); // 所有「可取消」定时器，dispose 时统一清掉
  const subscribers = [];
  let notifyQueued = false;
  let notifyCancel = null;

  /* ══════════════════════════════════════════════════════════
   * 2. 定时器 / 提交 / 通知
   * ══════════════════════════════════════════════════════════ */

  /** 带登记的一次性定时器；返回取消函数。 */
  function later(fn, ms) {
    if (disposed) return function () {};
    let cancel = null;
    const wrapped = function () {
      timers.delete(cancel);
      if (disposed) return;
      fn();
    };
    cancel = schedule(wrapped, ms);
    timers.add(cancel);
    return function () {
      timers.delete(cancel);
      try { cancel(); } catch (err) { /* 取消失败也不影响状态正确性 */ }
    };
  }

  /**
   * 一次结构变更：汇总预算 → 重建舰队快照 → rev++ → 节流通知。
   * 视图只读 state，所以这里直接原地改，不复制整个 state（省得视图拿不住引用）。
   */
  function commit() {
    if (disposed) return;
    syncBudget();
    syncFleet();
    state.selected = state.selectedId ? (state.missions[state.selectedId] || null) : null;
    state.rev += 1;
    notifySoon();
  }

  /** 全局预算 = 初始值 + 各任务 costUsd / tokenCount 的增量（replay 会自动回滚）。 */
  function syncBudget() {
    for (let i = 0; i < order.length; i += 1) {
      const id = order[i];
      const m = state.missions[id];
      if (!m) continue;
      const cost = num(m.costUsd, 0);
      const prevCost = num(costTracked[id], 0);
      if (cost !== prevCost) {
        state.budget.usedUsd = round6(state.budget.usedUsd + (cost - prevCost));
        costTracked[id] = cost;
      }
      const tokens = num(m.tokenCount, 0);
      const prevTokens = num(tokenTracked[id], 0);
      if (tokens !== prevTokens) {
        state.budget.usedTokens = Math.round(state.budget.usedTokens + (tokens - prevTokens));
        tokenTracked[id] = tokens;
      }
    }
  }

  /** 舰队列表是 mission 的「展示投影」：分组/进度/耗时/未读都从这里统一派生。 */
  function syncFleet() {
    const fleet = [];
    for (let i = 0; i < order.length; i += 1) {
      const id = order[i];
      const m = state.missions[id];
      if (!m) continue;
      const rt = runtimes[id];
      const group = rt ? rt.group : (m.group || 'running');
      m.group = group; // Lead 约定：mission.group 与舰队分组保持同一份
      const plan = m.plan || [];
      let doneCount = 0;
      for (let k = 0; k < plan.length; k += 1) if (plan[k].status === 'done') doneCount += 1;
      const progress = group === 'standing' || plan.length === 0
        ? '常驻'
        : doneCount + '/' + plan.length;
      let unread = false;
      for (let k = 0; k < (m.approvals || []).length; k += 1) {
        if (m.approvals[k].status === 'open') { unread = true; break; }
      }
      fleet.push({
        id: m.id,
        title: m.title,
        glyph: m.glyph,
        status: m.status,
        group: group,
        progress: progress,
        costUsd: m.costUsd,
        elapsed: fmtElapsed(m.elapsedSec),
        unread: unread,
      });
    }
    state.fleet = fleet;
  }

  /** 订阅回调合并到下一帧（rAF 可用就用，否则 16ms），避免一秒内多次重绘。 */
  function notifySoon() {
    if (disposed || notifyQueued || subscribers.length === 0) return;
    notifyQueued = true;
    const run = function () {
      notifyQueued = false;
      if (disposed) return;
      const list = subscribers.slice();
      for (let i = 0; i < list.length; i += 1) {
        try { list[i](state); } catch (err) {
          if (typeof console !== 'undefined' && console.error) console.error('[helm-engine] subscriber error', err);
        }
      }
    };
    if (typeof requestAnimationFrame === 'function') {
      const frameId = requestAnimationFrame(run);
      notifyCancel = function () {
        try {
          if (typeof cancelAnimationFrame === 'function') cancelAnimationFrame(frameId);
        } catch (err) { /* 忽略 */ }
      };
    } else {
      notifyCancel = schedule(run, 16);
    }
  }

  function subscribe(fn) {
    if (disposed || typeof fn !== 'function') return function () {};
    subscribers.push(fn);
    let active = true;
    return function unsubscribe() {
      if (!active) return;
      active = false;
      const index = subscribers.indexOf(fn);
      if (index >= 0) subscribers.splice(index, 1);
    };
  }

  /* ══════════════════════════════════════════════════════════
   * 3. 任务构建（MissionSpec / 模板 → Mission + runtime）
   * ══════════════════════════════════════════════════════════ */

  function emptyContext() {
    return { windowTokens: 0, capTokens: 128000, slices: [], memory: [], droppedSources: 0, compactions: 0 };
  }

  function normalizeFeed(ev, mid, index) {
    const out = ev ? clone(ev) : {};
    if (!out.id) out.id = mid + '-init-' + (index + 1);
    if (!out.at) out.at = simAt(); // 初始快照缺时间时补模拟时钟
    if (!out.actor) out.actor = 'agent';
    if (!out.kind) out.kind = 'note';
    if (!out.title) out.title = '继续执行';
    return out;
  }

  function normalizeApproval(ap, mid) {
    const out = ap ? clone(ap) : {};
    out.missionId = mid;
    if (!out.kind) out.kind = 'choice';
    if (!out.risk) out.risk = 'low';
    if (!Array.isArray(out.options)) out.options = [];
    if (!out.status) out.status = 'open';
    if (out.status !== 'open' && out.status !== 'resolved') out.status = 'open';
    if (!out.resolvedLabel) delete out.resolvedLabel;
    // autoResolve 是「剧本指令」，不是审批展示字段：先摘出来交给运行时。
    delete out.autoResolve;
    return out;
  }

  function buildMission(spec, id) {
    const ctx = spec.context ? clone(spec.context) : emptyContext();
    if (!Array.isArray(ctx.slices)) ctx.slices = [];
    if (!Array.isArray(ctx.memory)) ctx.memory = [];
    return {
      id: id,
      title: spec.title || '未命名任务',
      glyph: spec.glyph || 'dot',
      intent: spec.intent != null ? String(spec.intent) : (spec.title || ''),
      status: spec.status || 'running',
      autonomy: normLevel(spec.autonomy, state.autonomy),
      policyNote: spec.policyNote || '',
      elapsedSec: num(spec.elapsedSec, 0),
      costUsd: num(spec.costUsd, 0),
      tokenCount: num(spec.tokenCount, 0),
      budgetUsd: num(spec.budgetUsd, 1.5),
      // 托管把握（80% 口径）：模型趋势判断在界面上的最小投影，见 docs/思考与判断.md
      hold: spec.hold ? clone(spec.hold) : null,
      plan: (spec.plan || []).map(function (step, i) {
        const out = clone(step);
        if (out.index == null) out.index = i;
        return out;
      }),
      feed: (spec.feed || []).map(function (ev, i) { return normalizeFeed(ev, id, i); }),
      approvals: (spec.approvals || []).map(function (ap) { return normalizeApproval(ap, id); }),
      evidence: clone(spec.evidence || []),
      context: ctx,
      artifact: spec.artifact ? clone(spec.artifact) : null,
      takeover: null,
      replayable: !!(spec.beats && spec.beats.length),
      // MissionSpec 里有 group；§3 的 Mission 没写，但 Lead 的视图约定要读，故同步保留。
      group: spec.group || 'running',
    };
  }

  function deriveGroup(spec) {
    if (spec.group) return spec.group;
    if (spec.status === 'done') return 'done';
    if (spec.status === 'idle') return 'standing';
    if (spec.status === 'waiting') return 'need-you';
    return 'running';
  }

  function setGroup(m, rt, group) {
    rt.group = group;
    m.group = group;
  }

  function hasOpenApproval(m) {
    const list = m.approvals || [];
    for (let i = 0; i < list.length; i += 1) if (list[i].status === 'open') return true;
    return false;
  }

  function createRuntime(mission, spec, forcedEndMode) {
    const group = deriveGroup(spec);
    const rt = {
      mid: mission.id,
      beats: clone(spec.beats || []),
      idx: 0,
      cancel: null,
      playing: false, // 有 beat 定时器在跑
      blocked: false, // 被审批挡住（不是用户暂停）
      userPaused: false,
      halved: false, // 接管交还后后续 beat 减半
      end: false, // 剧本放完 / 终态 beat 已到
      started: false,
      remainingMs: null, // 暂停时剩下的真实等待
      pauseDiv: 1,
      scheduledWait: 0,
      timerStart: 0,
      div: 1,
      group: group,
      endMode: forcedEndMode || ((spec.group === 'standing' || spec.status === 'idle') ? 'idle' : 'done'),
      autoTimers: new Map(), // approvalId -> cancel
      autoConfigs: new Map(), // approvalId -> { level, delayMs, label }
      feedSeq: 0,
      prevStatus: null,
      snapshot: null,
    };
    rt.feedSeq = (mission.feed || []).length;
    mission.group = group;
    return rt;
  }

  function mapToObject(map) {
    const out = {};
    map.forEach(function (value, key) { out[key] = clone(value); });
    return out;
  }

  function normConf(raw, fallbackId) {
    if (!raw) return null;
    const approvalId = raw.approvalId != null ? String(raw.approvalId) : (fallbackId != null ? String(fallbackId) : '');
    if (!approvalId) return null;
    return {
      approvalId: approvalId,
      level: normLevel(raw.level, 'auto'),
      delayMs: Math.max(0, num(raw.delayMs, 1500)),
      label: raw.label || '按自主档位自动放行',
    };
  }

  /** 剧本两种写法都支持：MissionSpec.autoResolve[] 与 approval.autoResolve。 */
  function collectInitialAutoConfigs(spec, id) {
    const out = [];
    if (Array.isArray(spec.autoResolve)) {
      spec.autoResolve.forEach(function (c) {
        const conf = normConf(c);
        if (conf) out.push(conf);
      });
    }
    (spec.approvals || []).forEach(function (ap) {
      const conf = normConf(ap && ap.autoResolve, ap && ap.id);
      if (conf) out.push(conf);
    });
    return out;
  }

  /* ══════════════════════════════════════════════════════════
   * 4. 播放时间线
   * ══════════════════════════════════════════════════════════ */

  function divisor(rt) {
    return (state.speed || 1) * (rt && rt.halved ? 2 : 1);
  }
  function rawWait(rt, beat) {
    return Math.max(0, num(beat && beat.t, 0)) / divisor(rt);
  }
  function remainingNow(rt) {
    return Math.max(0, rt.scheduledWait - (now() - rt.timerStart));
  }
  function stopTimer(rt) {
    if (!rt || !rt.cancel) return;
    const cancel = rt.cancel;
    rt.cancel = null;
    try { cancel(); } catch (err) { /* 忽略 */ }
  }

  /**
   * 排下一条 beat。overrideWait 用于暂停/接管/变速后「接着剩下的时间跑」，
   * 这样 4x 按钮按下去不会把当前等待重置成完整时长。
   */
  function scheduleNext(mid, overrideWait) {
    const rt = runtimes[mid];
    if (!rt || disposed || rt.end) return;
    stopTimer(rt);
    if (rt.idx >= rt.beats.length) { finishBeats(mid); return; }
    const wait = overrideWait == null ? rawWait(rt, rt.beats[rt.idx]) : Math.max(0, overrideWait);
    rt.playing = true;
    rt.blocked = false;
    rt.timerStart = now();
    rt.scheduledWait = wait;
    rt.div = divisor(rt);
    const tick = function () {
      rt.cancel = null;
      rt.playing = false;
      if (disposed) return;
      const mission = state.missions[mid];
      if (!mission || rt.end || mission.status === 'paused' || mission.takeover) return;
      if (rt.idx >= rt.beats.length) { finishBeats(mid); commit(); return; }
      const beat = rt.beats[rt.idx];
      rt.idx += 1;
      const blocked = applyBeat(mid, beat);
      if (rt.end) { commit(); return; }
      if (blocked) { rt.blocked = true; commit(); return; }
      if (rt.idx >= rt.beats.length) { finishBeats(mid); commit(); return; }
      scheduleNext(mid);
      commit();
    };
    rt.cancel = later(tick, wait);
  }

  function startPlayback(mid) {
    const rt = runtimes[mid];
    if (!rt || rt.end || disposed) return;
    rt.started = true;
    if (!rt.beats.length) { finishBeats(mid); return; }
    scheduleNext(mid);
  }

  /** beat 放完后的收尾：按模板语法定 done 或回 idle（常驻任务不装死）。 */
  function finishBeats(mid) {
    const m = state.missions[mid];
    const rt = runtimes[mid];
    if (!m || !rt || rt.end) return;
    rt.playing = false;
    rt.blocked = false;
    if (rt.endMode === 'idle') {
      if (m.status !== 'paused') { m.status = 'idle'; setGroup(m, rt, 'standing'); }
      rt.end = true;
    } else if (m.status === 'running' || m.status === 'queued' || m.status === 'draft' || m.status === 'waiting') {
      m.status = 'done';
      setGroup(m, rt, 'done');
      rt.end = true;
    }
  }

  /** 暂停/接管时保存「这一条 beat 还剩多久」，恢复时接着跑而不是从头等。 */
  function freezeTimeline(rt) {
    if (rt && rt.cancel && rt.playing) {
      rt.remainingMs = remainingNow(rt);
      rt.pauseDiv = rt.div || divisor(rt);
      stopTimer(rt);
    }
    if (rt) rt.playing = false;
  }

  /** 恢复时把剩余时间按当前速度换算（变速/半速会改变真实等待）。 */
  function thawTimeline(mid) {
    const rt = runtimes[mid];
    if (!rt || rt.end || disposed) return;
    if (rt.remainingMs != null) {
      const scaled = rt.remainingMs * (rt.pauseDiv || divisor(rt)) / divisor(rt);
      rt.remainingMs = null;
      scheduleNext(mid, scaled);
      return;
    }
    if (!rt.started) { startPlayback(mid); return; }
    scheduleNext(mid);
  }

  /* ══════════════════════════════════════════════════════════
   * 5. beat 应用
   * ══════════════════════════════════════════════════════════ */

  function simAt() {
    return fmtClockSec(START_CLOCK_MIN * 60 + elapsedRealSec);
  }

  function pushFeed(mid, beat) {
    const m = state.missions[mid];
    const rt = runtimes[mid];
    if (!m || !rt) return;
    const ev = clone(beat.event || {});
    rt.feedSeq += 1;
    if (!ev.id) ev.id = mid + '-f-' + rt.feedSeq;
    if (!ev.at) ev.at = simAt();
    if (!ev.actor) ev.actor = 'agent';
    if (!ev.kind) ev.kind = 'note';
    if (!ev.title) ev.title = '继续执行';
    m.feed.push(ev);
  }

  function applyPlanBeat(m, beat) {
    if (!beat.stepId) return;
    const plan = m.plan || [];
    for (let i = 0; i < plan.length; i += 1) {
      if (plan[i].id !== beat.stepId) continue;
      if (beat.status) plan[i].status = beat.status;
      if (beat.meta !== undefined) plan[i].meta = beat.meta;
      return;
    }
  }

  /** artifact beat 的三种用法：null 占位忽略 / merge 合并 / deliver 回填 deliveredTo。 */
  function applyArtifactBeat(m, beat) {
    if (!beat.artifact) {
      // artifact 为 null 的 beat 只是占位：保留已有交付物，只可能回填交付去向。
      if (beat.deliver && m.artifact) m.artifact.deliveredTo = beat.deliver;
      return;
    }
    const incoming = clone(beat.artifact);
    if (beat.merge) {
      // 合并语义：只合并进「已有」artifact；没有可合并对象时按 null 占位处理。
      if (m.artifact) Object.assign(m.artifact, incoming);
    } else {
      m.artifact = incoming;
    }
    if (beat.deliver && m.artifact) m.artifact.deliveredTo = beat.deliver;
  }

  function applyMissionBeat(mid, beat) {
    const m = state.missions[mid];
    const rt = runtimes[mid];
    if (!m || !rt || !beat) return false;
    if (beat.policyNote) m.policyNote = beat.policyNote;
    if (beat.status) {
      m.status = beat.status;
      if (beat.status === 'done') {
        setGroup(m, rt, 'done');
        rt.end = true; // 终态后面的 beat 不再播
        m.takeover = null;
      } else if (beat.status === 'idle') {
        setGroup(m, rt, 'standing');
        rt.end = true;
      } else if (beat.status === 'waiting') {
        setGroup(m, rt, 'need-you');
      } else if (beat.status === 'paused') {
        rt.playing = false;
      } else if (beat.status === 'running' || beat.status === 'queued') {
        if (rt.group !== 'standing') setGroup(m, rt, 'running');
      }
    }
    if (beat.group) setGroup(m, rt, beat.group);
    return m.status === 'waiting' || m.status === 'paused';
  }

  function applyBudgetBeat(m, beat) {
    if (beat.costUsd != null) m.costUsd = num(beat.costUsd, m.costUsd);
    if (beat.tokenCount != null) m.tokenCount = num(beat.tokenCount, m.tokenCount);
    if (beat.elapsedSec != null) m.elapsedSec = num(beat.elapsedSec, m.elapsedSec);
  }

  /** 执行一条 beat；返回 true 表示这条 beat 把任务挡在「等待」上。 */
  function applyBeat(mid, beat) {
    const m = state.missions[mid];
    const rt = runtimes[mid];
    if (!m || !rt || !beat) return false;
    switch (beat.kind) {
      case 'feed':
        pushFeed(mid, beat);
        return false;
      case 'plan':
        applyPlanBeat(m, beat);
        return false;
      case 'approval':
        return openApproval(mid, beat.approval);
      case 'artifact':
        applyArtifactBeat(m, beat);
        return false;
      case 'mission':
        return applyMissionBeat(mid, beat);
      case 'budget':
        applyBudgetBeat(m, beat);
        return false;
      default:
        // 未知 kind 忽略而不抛错：场景数据可以先行演进，引擎保持向前兼容。
        return false;
    }
  }

  /* ══════════════════════════════════════════════════════════
   * 6. 审批与自动放行
   * ══════════════════════════════════════════════════════════ */

  function findApproval(approvalId) {
    for (let i = 0; i < order.length; i += 1) {
      const mid = order[i];
      const m = state.missions[mid];
      if (!m) continue;
      const list = m.approvals || [];
      for (let k = 0; k < list.length; k += 1) {
        if (list[k].id === approvalId) {
          return { mid: mid, mission: m, approval: list[k], runtime: runtimes[mid] };
        }
      }
    }
    return null;
  }

  function cancelAutoResolve(rt, approvalId) {
    if (!rt || !rt.autoTimers) return;
    const cancel = rt.autoTimers.get(approvalId);
    if (!cancel) return;
    rt.autoTimers.delete(approvalId);
    try { cancel(); } catch (err) { /* 忽略 */ }
  }

  /**
   * 打开一条审批。返回 true 表示任务被停住：
   * - 档位不够 → status=waiting + 归入「需要你」；
   * - 档位够 → 不打扰用户，但播放仍停在审批处，delayMs 后自动放行（预先授权也有成本）。
   */
  function openApproval(mid, rawApproval) {
    const m = state.missions[mid];
    const rt = runtimes[mid];
    if (!m || !rt || !rawApproval) return false;
    const raw = clone(rawApproval);
    const beatConf = normConf(raw.autoResolve, raw.id);
    delete raw.autoResolve;
    const ap = normalizeApproval(raw, mid);
    ap.status = 'open';
    delete ap.resolvedLabel;

    // 同 id 重复打开时覆盖，避免 approvals 里出现两条同名卡。
    let existing = null;
    for (let i = 0; i < m.approvals.length; i += 1) if (m.approvals[i].id === ap.id) { existing = m.approvals[i]; break; }
    if (existing) {
      for (const key of Object.keys(existing)) delete existing[key];
      Object.assign(existing, ap);
    } else {
      m.approvals.push(ap);
    }

    const conf = beatConf || rt.autoConfigs.get(ap.id) || null;
    if (conf) rt.autoConfigs.set(ap.id, conf);
    const authorized = conf && rankOf(m.autonomy) >= rankOf(conf.level);

    if (authorized) {
      // 预先授权：不切 waiting、不亮「需要你」红点，但仍暂停播放等授权倒计时。
      rt.blocked = true;
      scheduleAutoResolve(mid, ap, conf);
    } else {
      m.status = 'waiting';
      setGroup(m, rt, 'need-you');
      rt.blocked = true;
    }
    return true;
  }

  function scheduleAutoResolve(mid, approval, conf) {
    const rt = runtimes[mid];
    if (!rt || disposed) return;
    cancelAutoResolve(rt, approval.id);
    const delay = Math.max(0, num(conf.delayMs, 0)) / (state.speed || 1);
    const cancel = later(function () {
      if (disposed) return;
      rt.autoTimers.delete(approval.id);
      const m = state.missions[mid];
      if (!m) return;
      let target = null;
      for (let i = 0; i < m.approvals.length; i += 1) if (m.approvals[i].id === approval.id) target = m.approvals[i];
      if (!target || target.status !== 'open') return;
      // 用户主动暂停/接管时不越权放行，稍后再试；暂停解除后自然发生。
      if (m.status === 'paused' || m.takeover) {
        scheduleAutoResolve(mid, target, Object.assign({}, conf, { delayMs: 500 }));
        return;
      }
      target.status = 'resolved';
      target.resolvedLabel = conf.label || '按自主档位自动放行';
      continueAfterApproval(mid);
      commit();
    }, delay);
    rt.autoTimers.set(approval.id, cancel);
  }

  /**
   * 一条审批被解决后决定任务往哪走：
   * - 还有 open 审批 → 继续 waiting；
   * - 被用户暂停/接管 → 保持暂停；
   * - 否则回到 running 并把停下的时间线接上（初始审批则首次开播）。
   */
  function continueAfterApproval(mid) {
    const m = state.missions[mid];
    const rt = runtimes[mid];
    if (!m || !rt) return;
    if (hasOpenApproval(m)) {
      if (m.status !== 'paused' && m.status !== 'done' && !m.takeover) {
        m.status = 'waiting';
        setGroup(m, rt, 'need-you');
      }
      return;
    }
    if (m.status === 'paused' || m.takeover || rt.end) return;
    if (m.status === 'waiting') m.status = 'running';
    if (rt.group === 'need-you') setGroup(m, rt, rt.endMode === 'idle' ? 'standing' : 'running');
    rt.blocked = false;
    if (rt.playing) return; // 理论上不会发生，防御一下
    if (rt.remainingMs != null) {
      const scaled = rt.remainingMs * (rt.pauseDiv || divisor(rt)) / divisor(rt);
      rt.remainingMs = null;
      scheduleNext(mid, scaled);
      return;
    }
    if (!rt.started) { startPlayback(mid); return; }
    if (rt.idx >= rt.beats.length) { finishBeats(mid); return; }
    scheduleNext(mid);
  }

  /**
   * 档位变化后重新评估所有 open 审批：够档就自动放行，不够就退回等待。
   * 这样「现场把档位从代驾拨到自动」也能看到体验差异。
   */
  function reevaluateAutoResolves() {
    for (let i = 0; i < order.length; i += 1) {
      const mid = order[i];
      const m = state.missions[mid];
      const rt = runtimes[mid];
      if (!m || !rt) continue;
      if (m.status === 'paused' || m.takeover || m.status === 'done') continue;
      const list = m.approvals || [];
      for (let k = 0; k < list.length; k += 1) {
        const ap = list[k];
        if (ap.status !== 'open') continue;
        const conf = rt.autoConfigs.get(ap.id);
        if (!conf) continue;
        const authorized = rankOf(m.autonomy) >= rankOf(conf.level);
        if (authorized) {
          if (rt.autoTimers.has(ap.id)) continue;
          if (m.status === 'waiting') m.status = 'running';
          if (rt.group === 'need-you') setGroup(m, rt, rt.endMode === 'idle' ? 'standing' : 'running');
          rt.blocked = true;
          scheduleAutoResolve(mid, ap, conf);
        } else if (rt.autoTimers.has(ap.id)) {
          cancelAutoResolve(rt, ap.id);
          m.status = 'waiting';
          setGroup(m, rt, 'need-you');
          rt.blocked = true;
        }
      }
    }
  }

  /* ══════════════════════════════════════════════════════════
   * 7. 动作（全部同步、幂等安全）
   * ══════════════════════════════════════════════════════════ */

  function selectMission(id) {
    if (disposed) return;
    if (!id || !state.missions[id] || state.selectedId === id) return;
    state.selectedId = id;
    commit();
  }

  function setAutonomy(level) {
    if (disposed) return;
    const next = normLevel(level, null);
    if (!next) return;
    const selected = state.selectedId ? state.missions[state.selectedId] : null;
    if (state.autonomy === next && (!selected || selected.autonomy === next)) return;
    state.autonomy = next;
    if (selected) selected.autonomy = next;
    reevaluateAutoResolves();
    commit();
  }

  function setMissionAutonomy(id, level) {
    if (disposed) return;
    const m = state.missions[id];
    const next = normLevel(level, null);
    if (!m || !next || m.autonomy === next) return;
    m.autonomy = next;
    reevaluateAutoResolves();
    commit();
  }

  function pause(id) {
    if (disposed) return;
    const m = state.missions[id];
    const rt = runtimes[id];
    if (!m || !rt || m.status === 'paused' || m.status === 'done') return;
    rt.prevStatus = m.status;
    freezeTimeline(rt);
    rt.userPaused = true;
    rt.blocked = false;
    m.status = 'paused';
    commit();
  }

  function resume(id) {
    if (disposed) return;
    const m = state.missions[id];
    const rt = runtimes[id];
    if (!m || !rt || m.status !== 'paused') return;
    if (m.takeover) return; // 接管态要通过 resumeFromTakeover / cancelTakeover 交还
    rt.userPaused = false;
    rt.blocked = false;
    const open = hasOpenApproval(m);
    const prev = rt.prevStatus && rt.prevStatus !== 'paused' ? rt.prevStatus : 'running';
    if (open) {
      m.status = 'waiting';
      setGroup(m, rt, 'need-you');
      commit();
      return;
    }
    m.status = prev === 'waiting' ? 'running' : prev;
    if (rt.group === 'need-you') setGroup(m, rt, rt.endMode === 'idle' ? 'standing' : 'running');
    if (!rt.end) thawTimeline(id);
    commit();
  }

  function setSpeed(level) {
    if (disposed) return;
    const next = level === 4 ? 4 : 1;
    if (state.speed === next) return;
    const old = state.speed;
    state.speed = next;
    // 正在等待的任务：把真实剩余等待按新旧速度换算，避免 4x 后还要等完整时长。
    for (let i = 0; i < order.length; i += 1) {
      const rt = runtimes[order[i]];
      if (rt && rt.cancel && rt.playing) {
        const remaining = remainingNow(rt) * (old / next);
        stopTimer(rt);
        scheduleNext(order[i], remaining);
      }
    }
    commit();
  }

  function resolveApproval(approvalId, optionId) {
    if (disposed) return;
    const found = findApproval(approvalId);
    if (!found) return;
    const m = found.mission;
    const ap = found.approval;
    const rt = found.runtime;
    if (!ap || ap.status !== 'open') return; // 幂等：重复点不产生副作用
    let label = '';
    for (let i = 0; i < (ap.options || []).length; i += 1) {
      if (ap.options[i].id === optionId) { label = ap.options[i].label; break; }
    }
    ap.status = 'resolved';
    ap.resolvedLabel = label || (optionId != null ? String(optionId) : '已处理');
    cancelAutoResolve(rt, ap.id);
    continueAfterApproval(found.mid);
    commit();
  }

  function takeOver(missionId, stepId, instruction) {
    if (disposed) return;
    const m = state.missions[missionId];
    const rt = runtimes[missionId];
    if (!m || !rt) return;
    const plan = m.plan || [];
    let activeStep = '';
    for (let i = 0; i < plan.length; i += 1) {
      if (plan[i].status === 'active') { activeStep = plan[i].id; break; }
    }
    if (!activeStep) {
      for (let i = 0; i < plan.length; i += 1) {
        if (plan[i].status === 'blocked') { activeStep = plan[i].id; break; }
      }
    }
    const text = instruction == null ? '' : String(instruction);
    if (m.takeover) {
      // 幂等：重复接管只更新方向，不重复冻结时间线
      if (stepId) m.takeover.stepId = stepId;
      m.takeover.instruction = text;
      commit();
      return;
    }
    freezeTimeline(rt);
    rt.userPaused = false;
    m.takeover = { stepId: stepId || activeStep || '', instruction: text };
    m.status = 'paused';
    commit();
  }

  function resumeFromTakeover(missionId, instruction) {
    if (disposed) return;
    const m = state.missions[missionId];
    const rt = runtimes[missionId];
    if (!m || !rt || !m.takeover) return;
    const taken = m.takeover;
    const text = instruction == null ? '' : String(instruction).trim();
    m.takeover = null;
    // 叙事：人类给过方向后 agent 更快 —— 后续 beat 等待减半。
    rt.halved = true;
    rt.feedSeq += 1;
    const ev = {
      id: missionId + '-f-' + rt.feedSeq,
      at: simAt(),
      actor: 'human',
      kind: 'note',
      title: '接手改写：' + (text || '按我的方向继续'),
      detail: text ? '已按你的方向改写后续执行。' : '已交还控制，后续节奏加快。',
      tone: 'human',
    };
    if (taken && taken.stepId) ev.stepId = taken.stepId;
    m.feed.push(ev);

    const open = hasOpenApproval(m);
    if (open) {
      rt.blocked = true;
      m.status = 'waiting';
      setGroup(m, rt, 'need-you');
    } else {
      rt.blocked = false;
      m.status = rt.endMode === 'idle' ? 'idle' : 'running';
      if (rt.group === 'need-you') setGroup(m, rt, rt.endMode === 'idle' ? 'standing' : 'running');
      if (!rt.end) thawTimeline(missionId);
    }
    commit();
  }

  function cancelTakeover(missionId) {
    if (disposed) return;
    const m = state.missions[missionId];
    const rt = runtimes[missionId];
    if (!m || !rt) return;
    const wasTakeover = !!m.takeover;
    m.takeover = null;
    rt.halved = false; // 恢复原速
    if (wasTakeover && m.status === 'paused') {
      const open = hasOpenApproval(m);
      rt.blocked = open;
      if (open) {
        m.status = 'waiting';
        setGroup(m, rt, 'need-you');
      } else {
        m.status = rt.endMode === 'idle' ? 'idle' : 'running';
        if (rt.group === 'need-you') setGroup(m, rt, rt.endMode === 'idle' ? 'standing' : 'running');
        if (!rt.end) thawTimeline(missionId);
      }
    } else if (rt.playing && rt.cancel) {
      // 已经交还但仍在半速：把当前这段剩余等待按原速拉长回去。
      const remaining = remainingNow(rt) * 2;
      stopTimer(rt);
      scheduleNext(missionId, remaining);
    }
    commit();
  }

  function fallbackTemplate() {
    return {
      title: '新任务',
      glyph: 'spark',
      group: 'running',
      status: 'running',
      autonomy: state.autonomy,
      policyNote: '按当前档位推进，遇到对外动作前问你。',
      plan: [{ id: 'x-clarify', kind: 'clarify', title: '澄清意图', hint: '缺的信息先自己补，补不上才问你。', status: 'active' }],
      feed: [],
      approvals: [],
      evidence: [],
      context: emptyContext(),
      artifact: null,
      beats: [
        { t: 800, kind: 'plan', stepId: 'x-clarify', status: 'done' },
        { t: 300, kind: 'mission', status: 'done', group: 'done' },
      ],
    };
  }

  function startMission(intent, templateId) {
    if (disposed) return null;
    const text = intent == null ? '' : String(intent).trim();
    const templates = SCEN.templates || {};
    let tpl = templateId && templates[templateId] ? templates[templateId] : null;
    if (!tpl) tpl = templates.research || null; // 模板不存在时回退 research
    const source = tpl || fallbackTemplate();
    const endMode = (source.group === 'standing' || source.status === 'idle') ? 'idle' : 'done';

    missionSeq += 1;
    const id = 'm-user-' + missionSeq;
    const chars = Array.from(text);
    const title = chars.length ? chars.slice(0, 18).join('') + (chars.length > 18 ? '…' : '') : (source.title || '新任务');

    const spec = clone(source);
    spec.id = id;
    spec.title = title;
    spec.intent = text || spec.title;
    spec.status = 'running';
    spec.group = 'running'; // 新任务先出现在「进行中」，跑完再归位
    spec.elapsedSec = 0;
    spec.costUsd = 0;
    spec.tokenCount = 0;
    spec.budgetUsd = num(spec.budgetUsd, 1.5);
    spec.takeover = null;
    if (spec.artifact) delete spec.artifact.deliveredTo; // 模板里的交付记录属于旧任务

    // 模板里的审批 id / missionId 都是占位：加任务后缀避免多次新建撞车。
    const idMap = {};
    (spec.approvals || []).forEach(function (ap) {
      if (!ap) return;
      const oldId = ap.id;
      ap.missionId = id;
      if (oldId) {
        ap.id = oldId + '-' + id;
        idMap[oldId] = ap.id;
      }
      if (!ap.status) ap.status = 'open';
    });
    (spec.beats || []).forEach(function (beat) {
      if (!beat || beat.kind !== 'approval' || !beat.approval) return;
      const oldId = beat.approval.id;
      beat.approval.missionId = id;
      if (oldId) {
        beat.approval.id = oldId + '-' + id;
        idMap[oldId] = beat.approval.id;
      }
      beat.approval.status = 'open';
    });
    if (Array.isArray(spec.autoResolve)) {
      spec.autoResolve.forEach(function (conf) {
        if (conf && conf.approvalId && idMap[conf.approvalId]) conf.approvalId = idMap[conf.approvalId];
      });
    }

    const mission = buildMission(spec, id);
    mission.group = 'running';
    state.missions[id] = mission;
    order.unshift(id); // 插到舰队最前
    const rt = createRuntime(mission, spec, endMode);
    rt.group = 'running';
    mission.group = 'running';
    runtimes[id] = rt;
    costTracked[id] = 0;
    tokenTracked[id] = 0;
    collectInitialAutoConfigs(spec, id).forEach(function (conf) { rt.autoConfigs.set(conf.approvalId, conf); });
    rt.snapshot = {
      mission: clone(mission),
      beats: clone(rt.beats),
      group: rt.group,
      endMode: rt.endMode,
      autoConfigs: mapToObject(rt.autoConfigs),
    };

    state.selectedId = id;
    state.selected = mission;
    state.flash = { kind: 'ok', text: '已派给 agent：' + title };

    const open = mission.approvals.filter(function (ap) { return ap.status === 'open'; });
    open.forEach(function (ap) {
      const conf = rt.autoConfigs.get(ap.id);
      if (conf && rankOf(mission.autonomy) >= rankOf(conf.level)) scheduleAutoResolve(id, ap, conf);
    });
    if (open.length) {
      rt.blocked = true;
      mission.status = 'waiting';
      setGroup(mission, rt, 'need-you');
    } else if (rt.beats.length) {
      startPlayback(id);
    }
    commit();
    return id;
  }

  function confirmPlan(missionId) {
    if (disposed) return;
    const m = state.missions[missionId];
    const rt = runtimes[missionId];
    if (!m || !rt || rt.end) return;
    if (hasOpenApproval(m) || m.takeover || m.status === 'paused') return;
    if (rt.started) return; // 已在跑：幂等
    m.status = 'running';
    if (rt.group !== 'standing') setGroup(m, rt, 'running');
    if (rt.beats.length) startPlayback(missionId);
    else finishBeats(missionId);
    commit();
  }

  function replay(missionId) {
    if (disposed) return;
    const m = state.missions[missionId];
    const rt = runtimes[missionId];
    if (!m || !rt || !rt.snapshot) return;
    stopTimer(rt);
    rt.autoTimers.forEach(function (cancel) { try { cancel(); } catch (err) { /* 忽略 */ } });
    rt.autoTimers.clear();

    // 原地恢复，保证 state.selected 引用不变（视图按引用比较选中态）。
    for (const key of Object.keys(m)) delete m[key];
    Object.assign(m, clone(rt.snapshot.mission));

    rt.beats = clone(rt.snapshot.beats);
    rt.idx = 0;
    rt.started = false;
    rt.blocked = false;
    rt.userPaused = false;
    rt.halved = false;
    rt.end = false;
    rt.playing = false;
    rt.remainingMs = null;
    rt.pauseDiv = 1;
    rt.scheduledWait = 0;
    rt.prevStatus = null;
    rt.group = rt.snapshot.group || 'running';
    rt.endMode = rt.snapshot.endMode || 'done';
    rt.autoConfigs = new Map();
    const confs = rt.snapshot.autoConfigs || {};
    Object.keys(confs).forEach(function (key) { rt.autoConfigs.set(key, clone(confs[key])); });
    m.group = rt.group;

    const open = (m.approvals || []).filter(function (ap) { return ap.status === 'open'; });
    open.forEach(function (ap) {
      const conf = rt.autoConfigs.get(ap.id);
      if (conf && rankOf(m.autonomy) >= rankOf(conf.level)) scheduleAutoResolve(missionId, ap, conf);
    });
    if (open.length) {
      rt.blocked = true;
      if (m.status !== 'paused' && m.status !== 'done') {
        m.status = 'waiting';
        setGroup(m, rt, 'need-you');
      }
    } else {
      if (m.status === 'waiting') m.status = 'running';
      if (rt.beats.length && m.status !== 'paused' && m.status !== 'done' && m.status !== 'draft') {
        startPlayback(missionId);
      }
    }
    state.flash = { kind: 'ok', text: '已回到初始剧本，重新播放' };
    commit();
  }

  function consumeFlash() {
    if (disposed) return;
    if (!state.flash) return;
    state.flash = null;
    commit();
  }

  function dispose() {
    if (disposed) return;
    disposed = true;
    if (notifyCancel) {
      try { notifyCancel(); } catch (err) { /* 忽略 */ }
      notifyCancel = null;
    }
    timers.forEach(function (cancel) { try { cancel(); } catch (err) { /* 忽略 */ } });
    timers.clear();
    Object.keys(runtimes).forEach(function (mid) {
      const rt = runtimes[mid];
      if (!rt) return;
      rt.autoTimers.forEach(function (cancel) { try { cancel(); } catch (err) { /* 忽略 */ } });
      rt.autoTimers.clear();
      rt.cancel = null;
      rt.playing = false;
    });
    subscribers.length = 0;
  }

  /* ══════════════════════════════════════════════════════════
   * 8. 初始化：快照、初始审批、自动放行、时钟
   * ══════════════════════════════════════════════════════════ */

  function initMissionPlayback(mid) {
    const m = state.missions[mid];
    const rt = runtimes[mid];
    if (!m || !rt) return;
    const open = (m.approvals || []).filter(function (ap) { return ap.status === 'open'; });
    open.forEach(function (ap) {
      const conf = rt.autoConfigs.get(ap.id);
      if (conf && rankOf(m.autonomy) >= rankOf(conf.level)) scheduleAutoResolve(mid, ap, conf);
    });
    if (open.length) {
      rt.blocked = true;
      if (m.status !== 'paused' && m.status !== 'done') {
        m.status = 'waiting';
        setGroup(m, rt, 'need-you');
      }
      return; // 初始就有 open 审批：先等审批（m-weekly 的剧本从裁定之后开始）
    }
    if (m.status === 'waiting') m.status = 'running';
    if (m.status === 'done' || m.status === 'paused' || m.status === 'draft') return;
    if (rt.beats.length) startPlayback(mid);
  }

  let clockCancel = null;
  let elapsedCancel = null;

  function tickClock() {
    clockCancel = null;
    if (disposed) return;
    elapsedRealSec += 1;
    const next = fmtClock(START_CLOCK_MIN + Math.floor(elapsedRealSec / 60));
    const changed = next !== state.clock;
    state.clock = next;
    if (changed) commit();
    clockCancel = later(tickClock, 1000);
  }

  function tickElapsed() {
    elapsedCancel = null;
    if (disposed) return;
    let changed = false;
    for (let i = 0; i < order.length; i += 1) {
      const m = state.missions[order[i]];
      const rt = runtimes[order[i]];
      if (!m) continue;
      // 暂停/已完成/草稿不走耗时；审批等待也算任务耗时（人在等，任务时间在流逝）。
      if (m.status === 'paused' || m.status === 'done' || m.status === 'draft') continue;
      // 每 5 秒真实时间 ≈ 15 秒任务耗时（播放 1 秒 ≈ 3 秒任务耗时）。
      m.elapsedSec = num(m.elapsedSec, 0) + 15;
      changed = true;
      // 成本只在真正推进时涨；审批等待期间不涨，避免「等待也在烧钱」的错误暗示。
      if (rt && rt.playing) {
        m.costUsd = round6(num(m.costUsd, 0) + 0.003); // ≈ $0.0006 / 播放秒
        m.tokenCount = Math.round(num(m.tokenCount, 0) + 1000);
      }
    }
    if (changed) commit();
    elapsedCancel = later(tickElapsed, 5000);
  }

  (function init() {
    const specs = Array.isArray(SCEN.missions) ? SCEN.missions : [];
    let firstNeedYou = '';

    specs.forEach(function (spec) {
      if (!spec || !spec.id) return;
      const id = String(spec.id);
      if (state.missions[id]) return;
      const mission = buildMission(spec, id);
      state.missions[id] = mission;
      order.push(id);
      const rt = createRuntime(mission, spec);
      runtimes[id] = rt;
      collectInitialAutoConfigs(spec, id).forEach(function (conf) { rt.autoConfigs.set(conf.approvalId, conf); });
      costTracked[id] = num(mission.costUsd, 0);
      tokenTracked[id] = num(mission.tokenCount, 0);
      if (!firstNeedYou && rt.group === 'need-you') firstNeedYou = id;
    });

    // 先起播放/审批，再拍「初始快照」——这样 replay 恢复的是"打开驾驶舱那一刻"，
    // 但初始 status 已按 open 审批做过归一（waiting 的该等就等）。
    order.forEach(function (mid) { initMissionPlayback(mid); });
    order.forEach(function (mid) {
      const rt = runtimes[mid];
      const m = state.missions[mid];
      if (!rt || !m) return;
      rt.snapshot = {
        mission: clone(m),
        beats: clone(rt.beats),
        group: rt.group,
        endMode: rt.endMode,
        autoConfigs: mapToObject(rt.autoConfigs),
      };
    });

    // 初始选中：第一个「需要你」的任务；没有就选第一个（Lead 约定）。
    state.selectedId = firstNeedYou || order[0] || '';
    state.selected = state.selectedId ? state.missions[state.selectedId] : null;
    syncFleet(); // 只填充初值，不 rev++（打开瞬间 rev=0 就是快照）

    clockCancel = later(tickClock, 1000);
    elapsedCancel = later(tickElapsed, 5000);
  })();

  /* ══════════════════════════════════════════════════════════
   * 9. 对外接口
   * ══════════════════════════════════════════════════════════ */

  const actions = {
    selectMission: selectMission,
    setAutonomy: setAutonomy,
    setMissionAutonomy: setMissionAutonomy,
    pause: pause,
    resume: resume,
    setSpeed: setSpeed,
    resolveApproval: resolveApproval,
    takeOver: takeOver,
    resumeFromTakeover: resumeFromTakeover,
    cancelTakeover: cancelTakeover,
    startMission: startMission,
    confirmPlan: confirmPlan,
    replay: replay,
    consumeFlash: consumeFlash,
  };

  return {
    getState: function () { return state; },
    subscribe: subscribe,
    actions: actions,
    getSpeed: function () { return state.speed; },
    dispose: dispose,
  };
}

// ===== view-fleet.js =====
/**
 * HELM · 左栏「舰队」视图（view-fleet.js）
 *
 * 职责：今日任务的分组总览 + 新建任务入口 + 底部今日统计。
 * 结构（自上而下）：h-sec 小节头 → 新建入口（收起态单行 / 展开态就地输入区）
 *                  → 分组列表（独立滚动）→ 底部一行灰色统计。
 *
 * 布局取舍（为什么这么排）：
 * 1) 新建入口固定在滚动区之外。它是这一栏唯一的「主动作」，长列表滚动时不该被滚走；
 *    收起态只占一行（30px），展开时就地长高，代价可接受。
 * 2) 分组标题 sticky 在滚动区顶部：任务多起来以后，滚到哪里都知道自己在哪一段。
 * 3) 任务卡只给两行文字：标题（最多两行截断）+ 一行等宽副信息；292px 宽度放不下更多层级，
 *    信息密度靠字号与颜色差来拉，不靠分隔线，保证「发丝线」只出现在结构上。
 * 4) 信号色只用两处：需要你 / 选中任务的左竖条，以及「等你决定」徽标。其余状态色收在状态点里。
 *
 * 状态：本视图只保存纯 UI 状态（草稿文本 / 模板 / 展开与否 / 光标位置），引擎状态一律只读。
 */

/* 分组顺序固定：需要你 → 进行中 → 常驻 → 已完成。空组不渲染（见 render）。 */
const fleetGroups = [
  { key: 'need-you', label: '需要你' },
  { key: 'running', label: '进行中' },
  { key: 'standing', label: '常驻' },
  { key: 'done', label: '已完成' },
];

/* 状态 → 徽标文案 / 徽标样式 / 状态点样式。只有「等你决定」用信号色，其余徽标保持中性。 */
const fleetStatusMeta = {
  waiting: { label: '等你决定', badge: 'fleet-badge--wait', dot: 'h-dot--signal' },
  waits: { label: '等你决定', badge: 'fleet-badge--wait', dot: 'h-dot--signal' },
  running: { label: '执行中', badge: 'fleet-badge--run', dot: 'h-dot--signal' },
  queued: { label: '排队中', badge: 'fleet-badge--run', dot: 'h-dot--signal' },
  draft: { label: '草稿', badge: '', dot: '' },
  paused: { label: '已暂停', badge: 'fleet-badge--pause', dot: 'h-dot--warn' },
  done: { label: '已完成', badge: 'fleet-badge--done', dot: 'h-dot--ok' },
  idle: { label: '常驻', badge: 'fleet-badge--idle', dot: 'h-dot--info' },
};

/* group 缺失时按 status 兜底归组，避免剧本字段不齐时整栏空白。 */
const fleetFallbackGroup = {
  draft: 'running',
  queued: 'running',
  running: 'running',
  waiting: 'need-you',
  waits: 'need-you',
  paused: 'need-you',
  idle: 'standing',
  done: 'done',
};

/* 快捷意图：chip 只负责把意图原文填进 textarea + 记住模板，是否真的派发必须由用户二次确认。 */
const fleetTemplates = [
  {
    id: 'research',
    label: '竞品周报',
    intent: '把上周 7 家竞品的动作收成一页周报，标出 3 件值得跟进的事，发我飞书',
  },
  {
    id: 'build',
    label: 'PRD 拆任务',
    intent: '把这份 PRD 拆成开发任务：按依赖排好顺序，每条给出验收标准和工作量',
  },
  {
    id: 'watch',
    label: '监控竞品发布',
    intent: '盯着这 5 家竞品的发布页和 changelog，有更新就摘要并标出风险',
  },
];

/** 取任务所属分组；group 不在枚举里时按 status 兜底。 */
function fleetGroupOf(item) {
  if (!item) return 'running';
  const group = item.group;
  if (group === 'need-you' || group === 'running' || group === 'standing' || group === 'done') return group;
  return fleetFallbackGroup[item.status] || 'running';
}

/** 任务卡第二行的等宽副信息：elapsed · cost · progress（缺字段就跳过，不留空分隔符）。 */
function fleetItemLine(item, H) {
  const parts = [];
  if (item.elapsed) parts.push(item.elapsed);
  if (typeof item.costUsd === 'number') parts.push(H.fmtUsd(item.costUsd));
  if (item.progress) parts.push(item.progress);
  return parts.join(' · ');
}

/** 顶部今日统计："3 跑 · 1 等你"。跑 = 进行中组，等你 = 需要你组。 */
function fleetStatParts(fleet) {
  const running = fleet.filter((it) => it && fleetGroupOf(it) === 'running').length;
  const waiting = fleet.filter((it) => it && fleetGroupOf(it) === 'need-you').length;
  const parts = [];
  if (running) parts.push({ text: running + ' 跑' });
  if (waiting) parts.push({ text: waiting + ' 等你', tone: 'signal' });
  if (!parts.length) parts.push({ text: fleet.length ? fleet.length + ' 项' : '待命' });
  return parts;
}

/*
 * main.js 在 document 捕获阶段处理 Esc（插件模式下会直接关闭整个驾驶舱）。
 * 输入区展开时 Esc 的语义是「只收起输入区」，所以必须在更外层的 window 捕获阶段先吃掉它；
 * 收起来之后再按一次，才轮到 main 的全局 Esc（关闭）。全局只绑一个监听，随视图实例更新 owner。
 */
let fleetEscOwner = null;
let fleetEscGuardBound = false;

function fleetBindEscGuard() {
  if (fleetEscGuardBound || typeof window === 'undefined' || !window.addEventListener) return;
  fleetEscGuardBound = true;
  window.addEventListener(
    'keydown',
    (event) => {
      if (event.key !== 'Escape' || !fleetEscOwner) return;
      if (fleetEscOwner(event)) {
        event.preventDefault();
        event.stopPropagation();
      }
    },
    true,
  );
}

/**
 * 创建左栏舰队视图。
 * ctx = { engine, H, actions, ui }，ui = { focusPanels(tab), close() }（都可缺失，视图自兜底）。
 */
function createFleetView(ctx) {
  const conf = ctx || {};
  const Hx = conf.H || H; // 同一 IIFE 里 H 一定存在，ctx.H 只作覆盖
  const actions = conf.actions || (conf.engine && conf.engine.actions) || {};
  const ui = conf.ui || {};
  fleetBindEscGuard();

  /* 纯 UI 状态：全量重建时草稿、展开态、模板选择、光标都不能丢。 */
  const draft = { open: false, text: '', templateId: 'research', caret: null };
  let lastRoot = null; // 上一帧的根节点：用来判断重建前焦点是否还在输入框里
  let restoreToken = 0; // 只在「最新一帧」上恢复焦点，避免多次重建互相抢焦点

  /** 构建单张任务卡（button 语义 + aria-pressed 表示选中）。 */
  function buildItem(item, state) {
    const group = fleetGroupOf(item);
    const meta = fleetStatusMeta[item.status] || { label: item.status || '—', badge: '', dot: '' };
    const selected = item.id === state.selectedId;

    const cls = ['fleet-item'];
    if (group === 'need-you') cls.push('fleet-item--need');
    if (selected) cls.push('fleet-item--selected');

    // 有未读 → 呼吸点；否则按状态给点着色（状态色只允许出现在点上）。
    const dotClass = (item.unread ? 'h-dot h-dot--live' : 'h-dot ' + (meta.dot || '')).trim();

    const card = Hx.el(
      'button',
      {
        type: 'button',
        class: cls.join(' '),
        'data-testid': 'fleet-item-' + item.id,
        'data-id': item.id,
        'aria-pressed': String(selected),
        title: item.title || '未命名任务',
      },
      Hx.el('span', { class: dotClass + ' fleet-item__dot', 'aria-hidden': 'true' }),
      Hx.el(
        'span.fleet-item__body',
        null,
        Hx.el('span.fleet-item__title', { text: item.title || '未命名任务' }),
        Hx.el('span.fleet-item__meta.h-mono', { text: fleetItemLine(item, Hx) }),
      ),
      Hx.el('span', { class: ('fleet-badge ' + (meta.badge || '')).trim(), text: meta.label }),
    );

    card.addEventListener('click', () => {
      if (typeof actions.selectMission === 'function') actions.selectMission(item.id);
      // 点开「需要你」的任务时顺手把右栏切到待你处理：左栏的决策入口直达处理面板。
      if (group === 'need-you' && typeof ui.focusPanels === 'function') ui.focusPanels('inbox');
    });

    return card;
  }

  function render(state) {
    const s = state || {};
    const fleet = Array.isArray(s.fleet) ? s.fleet : [];

    // 引擎每次 rev 变化都会整栏重建。先记下「上一帧焦点在不在输入框」，后面挂载后再还焦点，
    // 否则用户打到一半的意图会被每秒一次的时钟刷新打断。
    const prevActive =
      lastRoot && lastRoot.contains(document.activeElement) ? document.activeElement : null;
    const hadInputFocus = !!(prevActive && prevActive.classList && prevActive.classList.contains('fleet-input'));
    if (hadInputFocus) {
      draft.caret = [prevActive.selectionStart, prevActive.selectionEnd];
      draft.open = true;
    }

    const root = Hx.el('div.h-view.fleet-root', {
      'data-testid': 'fleet-root',
      role: 'region',
      'aria-label': '今日舰队',
    });

    /* ---------- 1. 小节头 + 今日统计 ---------- */
    const stat = Hx.el('span.fleet-stat.h-mono');
    fleetStatParts(fleet).forEach((part, index) => {
      if (index) stat.appendChild(Hx.el('span.fleet-stat__sep', { text: ' · ' }));
      stat.appendChild(Hx.el('span', { class: part.tone === 'signal' ? 'fleet-stat__signal' : '', text: part.text }));
    });
    const aside = Hx.el('div.h-sec__aside');
    if (fleet.some((it) => it && fleetGroupOf(it) === 'running')) {
      aside.appendChild(Hx.el('span.h-dot.h-dot--live', { 'aria-hidden': 'true' }));
    }
    aside.appendChild(stat);
    root.appendChild(
      Hx.el('div.h-sec.fleet-sec', null, Hx.el('span.h-sec__label', { text: '今日舰队' }), aside),
    );

    /* ---------- 2. 新建任务入口（收起态单行 / 展开态输入区） ---------- */
    const newbar = Hx.el('div.fleet-newbar');
    const composer = Hx.el('div.fleet-composer', {
      hidden: !draft.open,
      id: 'fleet-composer',
      'aria-label': '新建任务',
    });
    const entryAside = Hx.el('span.fleet-new__aside.h-mono', { text: draft.open ? 'Esc 收起' : '' });
    const entry = Hx.el(
      'button.fleet-new',
      {
        type: 'button',
        'data-testid': 'fleet-new',
        'aria-expanded': String(draft.open),
        'aria-controls': 'fleet-composer',
      },
      Hx.el('span.fleet-new__plus', null, Hx.icon('plus', 13)),
      Hx.el('span.fleet-new__label', { text: '派一个新任务' }),
      entryAside,
    );

    const ta = Hx.el('textarea.fleet-input', {
      rows: '3',
      'data-testid': 'fleet-input',
      placeholder: '比如：把上周 7 家竞品的动作收成一页周报，标出 3 件值得跟进的事，发我飞书',
      'aria-label': '新任务的意图',
      spellcheck: 'false',
    });
    ta.value = draft.text;

    const chips = Hx.el('div.fleet-chips', { role: 'group', 'aria-label': '快捷意图' });
    const submit = Hx.el(
      'button.h-btn.h-btn--primary.h-btn--sm.h-btn--block.fleet-submit',
      { type: 'button', 'data-testid': 'fleet-submit', disabled: !draft.text.trim() },
      '派给 agent ▸',
    );
    const hint = Hx.el('span.fleet-hint', { text: 'Enter 派发 · Shift+Enter 换行' });

    // 输入区只在展开时才有必要撑高；收起时 DOM 仍保留（hidden），避免每次切换都丢状态。
    const autosize = () => {
      ta.style.height = 'auto';
      ta.style.height = Hx.clamp(ta.scrollHeight, 64, 148) + 'px';
    };
    const syncSubmit = () => {
      submit.disabled = !draft.text.trim();
    };
    const syncChips = () => {
      chips.querySelectorAll('.fleet-chip').forEach((chip) => {
        chip.setAttribute('aria-pressed', String(chip.getAttribute('data-template-id') === draft.templateId));
      });
    };

    const setOpen = (open) => {
      draft.open = open;
      composer.hidden = !open;
      entry.setAttribute('aria-expanded', String(open));
      entryAside.textContent = open ? 'Esc 收起' : '';
      if (open) {
        ta.focus({ preventScroll: true });
        const end = ta.value.length;
        try {
          ta.setSelectionRange(end, end);
        } catch (err) {
          /* 某些环境（如非交互式宿主）不支持 selection，忽略即可 */
        }
        autosize();
      }
    };

    // 输入区展开时，Esc 先收输入区（window 捕获层），不关驾驶舱
    fleetEscOwner = (event) => {
      if (!draft.open || !entry.isConnected) {
        if (!entry.isConnected) fleetEscOwner = null; // 视图已卸载，别占着全局 Esc
        return false;
      }
      // 只在焦点还在这栏（或什么都没聚焦）时拦截：别的栏的输入框有自己的 Esc 语义
      const target = event && event.target;
      if (target && target.nodeType === 1 && target !== document.body && !root.contains(target)) return false;
      setOpen(false);
      entry.focus({ preventScroll: true });
      return true;
    };

    const dispatch = () => {
      const intent = ta.value.trim();
      if (!intent) return;
      const templateId = draft.templateId || 'research';
      // 先清空本地草稿再派发：startMission 会同步触发 rev++ 重建，
      // 顺序反了的话新一帧会拿到旧草稿。
      draft.text = '';
      draft.open = false;
      draft.caret = null;
      ta.value = '';
      composer.hidden = true;
      entry.setAttribute('aria-expanded', 'false');
      entryAside.textContent = '';
      submit.disabled = true;
      // 先失焦：main.js 有「输入框聚焦时跳过重绘」的守卫，不失焦的话派发后列表要等下一拍才刷新
      if (typeof ta.blur === 'function') ta.blur();
      if (typeof actions.startMission === 'function') actions.startMission(intent, templateId);
    };

    // 快捷意图：只填草稿，不替用户做决定
    fleetTemplates.forEach((tpl) => {
      const chip = Hx.el(
        'button.h-chip.fleet-chip',
        {
          type: 'button',
          'data-testid': 'fleet-quick-' + tpl.id,
          'data-template-id': tpl.id,
          'aria-pressed': String(draft.templateId === tpl.id),
          title: tpl.intent,
        },
        tpl.label,
      );
      chip.addEventListener('click', () => {
        draft.text = tpl.intent;
        draft.templateId = tpl.id;
        draft.caret = [tpl.intent.length, tpl.intent.length];
        ta.value = tpl.intent;
        syncChips();
        syncSubmit();
        ta.focus({ preventScroll: true });
        try {
          ta.setSelectionRange(draft.caret[0], draft.caret[1]);
        } catch (err) {
          /* 忽略 */
        }
        autosize();
      });
      chips.appendChild(chip);
    });

    entry.addEventListener('click', () => setOpen(!draft.open));

    ta.addEventListener('input', () => {
      draft.text = ta.value;
      draft.caret = [ta.selectionStart, ta.selectionEnd];
      autosize();
      syncSubmit();
    });
    ['keyup', 'click', 'select'].forEach((evt) => {
      ta.addEventListener(evt, () => {
        draft.caret = [ta.selectionStart, ta.selectionEnd];
      });
    });
    ta.addEventListener('keydown', (evt) => {
      // 中文输入法组词中（isComposing / keyCode 229），Enter 是选词，不是派发
      if (evt.isComposing || evt.keyCode === 229) return;
      if (evt.key === 'Escape') {
        evt.preventDefault();
        evt.stopPropagation(); // 别让 Esc 冒泡成「关闭驾驶舱」
        setOpen(false);
        entry.focus({ preventScroll: true });
        return;
      }
      if (evt.key === 'Enter' && !evt.shiftKey) {
        evt.preventDefault();
        dispatch();
      }
    });
    // 焦点在 chip / 提交按钮上时，Esc 同样只收起输入区
    composer.addEventListener('keydown', (evt) => {
      if (evt.key !== 'Escape' || evt.defaultPrevented) return;
      evt.stopPropagation();
      setOpen(false);
      entry.focus({ preventScroll: true });
    });
    submit.addEventListener('click', dispatch);

    composer.appendChild(ta);
    composer.appendChild(chips);
    composer.appendChild(submit);
    composer.appendChild(hint);
    newbar.appendChild(entry);
    newbar.appendChild(composer);
    root.appendChild(newbar);

    /* ---------- 3. 分组列表（唯一滚动区） ---------- */
    const list = Hx.el('div.fleet-list.h-scroll', { 'data-testid': 'fleet-list' });
    if (!fleet.length) {
      list.appendChild(
        Hx.el(
          'div.h-empty',
          null,
          Hx.icon('radar', 22),
          Hx.el('span', { text: '舰队还是空的' }),
          Hx.el('span.fleet-empty__hint', { text: '派一个任务，看它自己跑起来' }),
        ),
      );
    }
    fleetGroups.forEach((group) => {
      const items = fleet.filter((it) => it && fleetGroupOf(it) === group.key);
      if (!items.length) return; // 空组不渲染
      const section = Hx.el('div.fleet-group', { role: 'group', 'aria-label': group.label });
      if (group.key === 'need-you') section.className += ' fleet-group--need';
      section.appendChild(
        Hx.el(
          'div.fleet-group__head',
          null,
          Hx.el('span.fleet-group__label', { text: group.label }),
          Hx.el('span.fleet-group__count.h-mono', { text: String(items.length) }),
          Hx.el('span.fleet-group__line', { 'aria-hidden': 'true' }),
        ),
      );
      items.forEach((item) => section.appendChild(buildItem(item, s)));
      list.appendChild(section);
    });
    root.appendChild(list);

    /* ---------- 4. 底部今日统计 ---------- */
    const budget = s.budget || {};
    const foot = Hx.el(
      'div.fleet-foot',
      null,
      Hx.el('span.fleet-foot__stats.h-mono', {
        text: Hx.fmtTokens(budget.usedTokens || 0) + ' tok · ' + Hx.fmtUsd(budget.usedUsd || 0),
        title: '今日 tokens 与花费',
      }),
    );
    const escBtn = Hx.el(
      'button.fleet-esc',
      { type: 'button', 'data-testid': 'fleet-close', 'aria-label': '关闭驾驶舱', title: '关闭驾驶舱（Esc）' },
      Hx.el('span.h-kbd', { text: 'Esc' }),
      Hx.el('span.fleet-esc__label', { text: '关闭' }),
    );
    escBtn.addEventListener('click', () => {
      if (typeof ui.close === 'function') ui.close();
    });
    foot.appendChild(escBtn);
    root.appendChild(foot);

    /* ---------- 挂载后：输入框自动撑高 + 还焦点 ---------- */
    lastRoot = root;
    const token = ++restoreToken;
    if (draft.open) {
      setTimeout(() => {
        if (token !== restoreToken || !root.isConnected) return;
        autosize(); // 重建后 textarea 还没挂载时 scrollHeight 为 0，需要挂载后再量一次
        if (!hadInputFocus) return;
        ta.focus({ preventScroll: true });
        const caret = draft.caret || [ta.value.length, ta.value.length];
        try {
          ta.setSelectionRange(Math.min(caret[0], ta.value.length), Math.min(caret[1], ta.value.length));
        } catch (err) {
          /* 忽略 */
        }
      }, 0);
    }

    return root;
  }

  return { render };
}

  color: var(--h-text-4);
  font-family: inherit;
  font-size: 9.5px;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}
.fleet-esc:hover { color: var(--h-text-2); background: var(--h-panel-2); }
.fleet-esc:focus-visible { outline: 2px solid var(--h-signal); outline-offset: 1px; }

@media (prefers-reduced-motion: reduce) {
  .fleet-new,
  .fleet-new__plus svg,
  .fleet-input,
  .fleet-chip,
  .fleet-item,
  .fleet-item::before,
  .fleet-esc { transition: none; }

// ===== view-mission.js =====
/**
 * 中栏：任务详情。任务头（意图 / 成本 / 档位）+ 计划 + 执行流 + 接管抽屉。
 * 这里承载原型的核心主张：人类读的是「意图 → 计划 → 例外」，而不是滚聊天记录。
 */
function createMissionView(ctx) {
  const { H, actions } = ctx;

  /** 只属于 UI 的状态：被点选过滤的步骤、已播放入场动画的事件。 */
  let filterStepId = null;
  const seen = new Set();
  let lastFeedCount = 0;

  const ACTOR_ICON = { agent: 'bot', subagent: 'split', human: 'user', system: 'shield' };
  const ACTOR_LABEL = { agent: 'agent', subagent: 'subagent', human: '你', system: '系统' };

  const STATUS_LABEL = {
    draft: '草稿',
    queued: '排队',
    running: '执行中',
    waiting: '等你决定',
    paused: '已暂停',
    done: '已完成',
    idle: '常驻',
  };
  const STATUS_TONE = {
    running: 'signal',
    waiting: 'warn',
    paused: 'dim',
    done: 'ok',
    idle: 'info',
  };

  function statusChip(status) {
    const tone = STATUS_TONE[status] || 'dim';
    return H.el('span.h-chip', { class: `h-chip h-chip--${tone}` }, H.icon(status === 'done' ? 'check' : status === 'waiting' ? 'clock' : 'dot', 10), STATUS_LABEL[status] || status);
  }

  function missionHead(mission, state) {
    const done = mission.plan.filter((s) => s.status === 'done').length;
    const total = mission.plan.length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const canRun = mission.status === 'running' || mission.status === 'waiting' || mission.status === 'paused';

    return H.el('div.mission-head', null,
      H.el('div.mission-head__top', null,
        H.el('span.mission-head__glyph', null, H.icon(mission.glyph || 'target', 15)),
        H.el('div.mission-head__titlebox', null,
          H.el('div.mission-head__title', { 'data-testid': 'mission-title' }, mission.title),
          H.el('div.mission-head__sub', null,
            statusChip(mission.status),
            H.el('span.h-chip.h-chip--dim.h-chip--mono', null, `进度 ${done}/${total}`),
            H.el('span.h-chip.h-chip--dim.h-chip--mono', null, `耗时 ${H.fmtElapsed(mission.elapsedSec)}`),
            H.el('span.h-chip.h-chip--dim.h-chip--mono', null, `${H.fmtUsd(mission.costUsd)} / ${H.fmtUsd(mission.budgetUsd)}`),
            H.el('span.h-chip.h-chip--dim.h-chip--mono', null, `${H.fmtTokens(mission.tokenCount)} tok`),
            mission.hold
              ? H.el('span.h-chip.h-chip--dim.mission-hold', { title: mission.hold.note },
                  H.icon('shield', 9), `托管把握 ${mission.hold.pct}%`)
              : null,
          ),
        ),
        H.el('div.mission-head__actions', null,
          canRun
            ? H.el('button.h-btn.h-btn--sm', {
                'data-testid': 'mission-pause',
                onClick: () => (mission.status === 'paused' ? actions.resume(mission.id) : actions.pause(mission.id)),
              }, H.icon(mission.status === 'paused' ? 'play' : 'pause', 12), mission.status === 'paused' ? '继续' : '暂停')
            : null,
          canRun
            ? H.el('button.h-btn.h-btn--sm', {
                'data-testid': 'mission-takeover',
                onClick: () => actions.takeOver(mission.id, activeStepId(mission)),
              }, H.icon('hand', 12), '接管')
            : null,
          H.el('button.h-btn.h-btn--sm.h-btn--ghost', {
            'data-testid': 'mission-replay',
            title: '回到这个任务的初始剧本，再跑一遍',
            onClick: () => actions.replay(mission.id),
          }, H.icon('replay', 12), '重跑'),
        ),
      ),

      // 意图原文：界面上最大的字。产品立场——人给的是意图，不是指令序列。
      H.el('div.mission-intent', null,
        H.el('div.mission-intent__label', null, H.icon('compass', 11), '意图'),
        H.el('div.mission-intent__text', { 'data-testid': 'mission-intent' }, mission.intent),
      ),

      H.el('div.mission-head__policy', null,
        H.icon('shield', 11),
        H.el('span', null, mission.policyNote || ''),
        H.el('span.mission-head__policy-level', null,
          `档位 · ${({ observe: '观察', propose: '提议', drive: '代驾', auto: '自动' })[mission.autonomy] || '代驾'}`),
        H.el('div.h-bar.mission-head__budgetbar', null, H.el('i', { style: { width: pct + '%' } })),
      ),
    );
  }

  function activeStepId(mission) {
    const active = mission.plan.find((s) => s.status === 'active') || mission.plan.find((s) => s.status === 'blocked');
    return active ? active.id : mission.plan[0] && mission.plan[0].id;
  }

  /* ---------------- 计划 ---------------- */
  function planColumn(mission) {
    const steps = mission.plan.map((step, i) => {
      const isActive = step.status === 'active';
      const isBlocked = step.status === 'blocked';
      const dim = filterStepId && filterStepId !== step.id;
      return H.el('div.mission-step', {
        class: `mission-step mission-step--${step.status}${dim ? ' mission-step--dim' : ''}`,
        'data-testid': 'mission-step-' + step.id,
        'data-step': step.id,
        title: step.status === 'blocked' ? '这一步卡在你这里，点开右侧「待你处理」' : '只看这一步的执行流',
        onClick: () => { filterStepId = filterStepId === step.id ? null : step.id; ctx.rerender(); },
      },
        H.el('div.mission-step__rail', null,
          H.el('span.mission-step__icon', { class: 'mission-step__icon mission-step__icon--' + step.status },
            step.status === 'done' ? H.icon('check', 11)
              : step.status === 'active' ? H.el('span.mission-step__pulse')
                : step.status === 'blocked' ? H.icon('clock', 11)
                  : step.status === 'skipped' ? H.icon('x', 10)
                    : H.el('span.mission-step__index', null, String(i + 1))),
        ),
        H.el('div.mission-step__body', null,
          H.el('div.mission-step__titleline', null,
            H.el('span.mission-step__title', null, step.title),
            step.meta ? H.el('span.mission-step__meta', null, step.meta) : null,
            isBlocked ? H.el('span.mission-step__blocked', null, '等你') : null,
          ),
          H.el('div.mission-step__hint', null, step.hint),
          isActive ? H.el('div.mission-step__progress', null, H.el('i')) : null,
        ),
      );
    });

    const doneCount = mission.plan.filter((s) => s.status === 'done').length;
    return H.el('div.mission-plan', { 'data-testid': 'mission-plan' },
      H.el('div.h-sec.mission-plan__head', null,
        H.el('span.h-sec__label', null, '计划'),
        H.el('span.h-sec__aside', null,
          filterStepId ? H.el('button.h-btn.h-btn--sm.h-btn--ghost', { onClick: () => { filterStepId = null; ctx.rerender(); } }, '显示全部') : null,
          H.el('span.h-chip.h-chip--dim.h-chip--mono', null, `${doneCount}/${mission.plan.length}`),
        ),
      ),
      H.el('div.mission-plan__list.h-scroll', null, steps),
      H.el('div.mission-plan__foot', null,
        H.icon('info', 11),
        H.el('span', null, '计划由 agent 自拟，你可以点任意一步只读它的执行流；「接管」会暂停并让你改写方向。'),
      ),
    );
  }

  /* ---------------- 执行流 ---------------- */
  function feedEvent(mission, event) {
    const entering = !seen.has(event.id);
    if (entering) seen.add(event.id);
    const tone = event.tone ? ` mission-feed__item--${event.tone}` : '';
    const isNew = entering && seen.size > 1;

    const chips = [];
    if (event.tool) chips.push(H.el('span.h-chip.h-chip--dim.h-chip--mono', null, event.tool));
    if (event.ms) chips.push(H.el('span.h-chip.h-chip--dim.h-chip--mono', null, `${event.ms}ms`));
    if (event.tokens) chips.push(H.el('span.h-chip.h-chip--dim.h-chip--mono', null, `${H.fmtTokens(event.tokens)} tok`));
    for (const id of event.evidenceIds || []) {
      const ev = mission.evidence.find((e) => e.id === id);
      if (!ev) continue;
      const tone2 = ev.status === 'conflict' ? 'warn' : ev.status === 'weak' ? 'warn' : 'info';
      chips.push(H.el('button.h-chip.h-chip--' + tone2 + '.mission-feed__ev', {
        title: ev.claim,
        onClick: (e) => { e.stopPropagation(); ctx.ui.focusEvidence(id); },
      }, H.icon('link', 9), ev.source.org));
    }

    return H.el('div.mission-feed__item', {
      class: 'mission-feed__item' + tone + (isNew ? ' h-enter' : ''),
      'data-kind': event.kind,
      'data-id': event.id,
      onClick: () => { if (event.actor === 'human') ctx.ui.focusPanels('inbox'); },
    },
      H.el('div.mission-feed__time.h-mono', null, event.at || ''),
      H.el('div.mission-feed__glyph', { class: 'mission-feed__glyph mission-feed__glyph--' + event.actor },
        H.icon(ACTOR_ICON[event.actor] || 'dot', 12)),
      H.el('div.mission-feed__body', null,
        H.el('div.mission-feed__titleline', null,
          H.el('span.mission-feed__title', null, event.title),
          H.el('span.mission-feed__actor', null, ACTOR_LABEL[event.actor] || event.actor),
        ),
        event.detail ? H.el('div.mission-feed__detail', null, event.detail) : null,
        chips.length ? H.el('div.mission-feed__chips', null, chips) : null,
      ),
    );
  }

  function feedColumn(mission, state) {
    const events = filterStepId ? mission.feed.filter((e) => e.stepId === filterStepId) : mission.feed;
    const live = mission.status === 'running';

    const items = events.map((e) => feedEvent(mission, e));
    const body = H.el('div.mission-feed__list', { 'data-testid': 'mission-feed' }, items.length ? items : H.el('div.h-empty', null, H.icon('radar', 22), '这一步还没有动作。'));

    const openApproval = mission.approvals.find((a) => a.status === 'open');
    const waitingBar = openApproval
      ? H.el('div.mission-wait', null,
          H.el('span.mission-wait__dots', null, H.el('span'), H.el('span'), H.el('span')),
          H.el('div.mission-wait__text', null,
            H.el('b', null, '正在等你：'),
            openApproval.title,
          ),
          H.el('button.h-btn.h-btn--primary.h-btn--sm', {
            'data-testid': 'mission-goto-approval',
            onClick: () => ctx.ui.focusApproval(openApproval.id),
          }, '去处理', H.icon('arrow', 11)),
        )
      : null;

    const deliveredBar = mission.artifact && mission.artifact.deliveredTo
      ? H.el('div.mission-done', null,
          H.icon('check', 12),
          H.el('span', null, `交付完成 · ${mission.artifact.deliveredTo}`),
          H.el('button.h-btn.h-btn--sm.h-btn--ghost', { onClick: () => ctx.ui.focusPanels('artifact') }, '看交付物', H.icon('arrow', 11)),
        )
      : null;

    return H.el('div.mission-feed', null,
      H.el('div.h-sec', null,
        H.el('span.h-sec__label', null, '执行流'),
        H.el('span.h-sec__aside', null,
          H.el('button.h-btn.h-btn--sm.h-btn--ghost', {
            title: '切换播放速度（演示用）',
            onClick: () => actions.setSpeed(state.speed === 4 ? 1 : 4),
          }, H.icon('clock', 11), `${state.speed === 4 ? '4x' : '1x'}`),
          live ? H.el('span.h-chip.h-chip--signal', null, H.el('span.h-dot.h-dot--live'), '实时') : null,
          filterStepId ? H.el('span.h-chip.h-chip--info', null, '已按步骤过滤') : null,
        ),
      ),
      waitingBar,
      deliveredBar,
      body,
    );
  }

  /* ---------------- 接管抽屉 ---------------- */
  function takeoverDrawer(mission) {
    const t = mission.takeover;
    if (!t) return null;
    if (takeoverDraft === null || takeoverStep !== t.stepId) {
      takeoverDraft = '';
      takeoverStep = t.stepId;
    }
    const step = mission.plan.find((s) => s.id === t.stepId);
    const input = H.el('textarea.mission-takeover__input', {
      rows: '3',
      'data-testid': 'takeover-input',
      placeholder: '用一句话改写方向。例如：「定价先不要下结论，把三家官方页面的价格表抓全，附原始截图。」',
      onInput: (e) => { takeoverDraft = e.target.value; },
    });
    input.value = takeoverDraft;
    return H.el('div.mission-takeover', { 'data-testid': 'mission-takeover' },
      H.el('div.mission-takeover__head', null,
        H.icon('hand', 13),
        H.el('span.mission-takeover__title', null, '你正在接管'),
        H.el('span.h-chip.h-chip--dim', null, step ? '第 ' + (step.index + 1) + ' 步 · ' + step.title : ''),
        H.el('span.mission-takeover__note', null, '接管期间 agent 暂停；交还后它会按你的方向继续跑。'),
      ),
      input,
      H.el('div.mission-takeover__actions', null,
        H.el('button.h-btn.h-btn--sm.h-btn--ghost', { onClick: () => actions.cancelTakeover(mission.id) }, '取消'),
        H.el('button.h-btn.h-btn--primary.h-btn--sm', {
          'data-testid': 'takeover-submit',
          onClick: () => {
            const value = takeoverDraft.trim();
            if (!value) return;
            takeoverDraft = null;
            takeoverStep = null;
            actions.resumeFromTakeover(mission.id, value);
          },
        }, '交还并继续', H.icon('arrow', 11)),
      ),
    );
  }

  let takeoverDraft = null;
  let takeoverStep = null;

  /* ---------------- 组装 ---------------- */
  function build(state) {
    const mission = state.selected;
    return H.el('div.mission-view.h-scroll', { 'data-testid': 'mission-view' },
      missionHead(mission, state),
      H.el('div.mission-body', null,
        planColumn(mission),
        feedColumn(mission, state),
      ),
      takeoverDrawer(mission),
    );
  }

  let lastScrolledCount = 0;

  // feed 追加时自动滚到底部，模拟"正在发生"的现场感
  function scrollFeedToBottom(count) {
    requestAnimationFrame(() => {
      const list = document.querySelector('[data-testid="mission-feed"]');
      if (list && count !== lastScrolledCount) {
        lastScrolledCount = count;
        list.scrollTop = list.scrollHeight;
      }
    });
  }

  return {
    render(state) {
      const next = build(state);
      scrollFeedToBottom(state.selected.feed.length);
      return next;
    },
    resetFilter() { filterStepId = null; },
  };
}
